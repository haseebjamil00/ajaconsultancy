<script src="assets/blog-config.js"></script>
<script>
async function loadPost() {
  const cfg = window.BLOG_CONFIG;
  const params = new URLSearchParams(window.location.search);
  const filename = params.get("post");
  const contentEl = document.getElementById("post-content");

  if (!filename) {
    contentEl.innerHTML = "<p>No post specified.</p>";
    return;
  }

  try {
    const rawUrl = `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${cfg.contentPath}/${filename}`;
    const text = await (await fetch(rawUrl)).text();
    const { meta, body } = splitFrontMatter(text);

    document.title = (meta.title || "Blog") + " | AJA Engineering Consultancy";

    contentEl.innerHTML = `
      ${meta.image ? `<img class="cover" src="${meta.image}" alt="${escapeHtml(meta.title||'')}">` : ""}
      <h1>${escapeHtml(meta.title || "Untitled post")}</h1>
      <div class="post-date">${formatDate(meta.date)}</div>
      <div class="post-body">${marked.parse(body)}</div>
    `;
  } catch (err) {
    contentEl.innerHTML = "<p>Sorry, this post couldn't be loaded.</p>";
    console.error(err);
  }
}

function splitFrontMatter(text) {
  const match = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
  const meta = {};
  let body = text;
  if (match) {
    match[1].split("\n").forEach(line => {
      const idx = line.indexOf(":");
      if (idx === -1) return;
      const key = line.slice(0, idx).trim();
      let val = line.slice(idx + 1).trim();
      val = val.replace(/^["']|["']$/g, "");
      meta[key] = val;
    });
    body = match[2];
  }
  return { meta, body };
}

function formatDate(d) {
  if (!d) return "";
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

loadPost();
</script>
